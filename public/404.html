<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="utf-8" />
        <title>Redirecting…</title>
        <script>
            sessionStorage.setItem(
                'spa-redirect',
                location.pathname + location.search + location.hash
            );
            location.replace('/');
        </script>
    </head>

</html>
