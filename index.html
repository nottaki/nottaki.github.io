<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>definitely not Taki !</title>
    <style>
      .preloader {
        background-color: #111111;
        position: fixed;
        inset: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        perspective: 1000px;
        transition: transform 1.5s ease-in-out,
          filter 1.5s ease-in-out,
          opacity 1.5s ease-in-out;
        z-index: 9999;
        overflow: hidden;
        will-change: transform, opacity;
        animation: customFadeIn 1s cubic-bezier(0.645, 0.045, 0.355, 1);
      }

      .preloader.exit {
        transform: scale(20);
        opacity: 0;
        pointer-events: none;
      }

      .cd-wrapper {
        transition: transform 0.1s ease-out;
      }

      .cd {
        position: relative;
        height: 300px;
        width: 300px;
        border-radius: calc(infinity * 1px);
        background: radial-gradient(circle,
            transparent 30%,
            #ffffff1a 35%,
            transparent 40%),
          conic-gradient(from 0deg,
            #d1d5db,
            #ffffff,
            #e6f0ff,
            #9ca3af,
            #ffffff,
            #d1d5db);
        animation: spinCD 3s linear infinite;
        box-shadow: inset 0 0 0 2px #d1d5db, 0 0 0 4px #ffffff;
      }

      /* Plastic part */
      .cd::before {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        border-radius: calc(infinity * 1px);
        height: 120px;
        width: 120px;
        background-color: #aecfda88;
        box-shadow: inset 0 0 0 2px #ffffffe6,
          inset 0 0 5px #0000004d;
      }

      /* Hole in the middle */
      .cd::after {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        height: 60px;
        width: 60px;
        border-radius: calc(infinity * 1px);
        background-color: #111111;
        box-shadow: 0 0 6px 1px #ffffff;
      }

      @keyframes spinCD {
        0% {
          transform: rotateZ(0deg);
        }

        100% {
          transform: rotateZ(360deg);
        }
      }

      @keyframes customFadeIn {
        0% {
          opacity: 0;
          scale: 1.2;
        }

        100% {
          opacity: 1;
        }
      }
    </style>
  </head>

  <body>
    <!-- Site pre-loader -->
    <div class="preloader">
      <div class="cd-wrapper">
        <div class="cd"></div>
      </div>
    </div>

    <!-- React App -->
    <div id="root"></div>

    <!-- Site pre-loader script -->
    <script>
      const preloader = document.querySelector('.preloader');
      const wrapper = document.querySelector('.cd-wrapper');
      const MAX_TILT_DEGREES = 30;

      const handleMouseMove = (e) => {
        // Find the exact center of the whole browser window
        const centerX = window.innerWidth / 2;
        const centerY = window.innerHeight / 2;

        // Get current mouse position
        const mouseX = e.clientX;
        const mouseY = e.clientY;

        // Calculate the tilt based on window size
        // We use `window.innerWidth / 2` as the divisor so the max tilt happens at the edges of the screen
        const rotateY = ((mouseX - centerX) / centerX) * MAX_TILT_DEGREES;
        const rotateX = -((mouseY - centerY) / centerY) * MAX_TILT_DEGREES;

        // Apply the tilt to the WRAPPER, not on CD itself ~ !!
        wrapper.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
      }

      document.addEventListener('mousemove', handleMouseMove);

      window.addEventListener('load', () => {
        setTimeout(() => {
          document.removeEventListener('mousemove', handleMouseMove);
          wrapper.style.transform = `rotateX(0deg) rotateY(0deg)`;
          preloader.classList.add('exit');
          setTimeout(() => {
            preloader.remove()
          }, 2000);
        }, 4000);
      });
    </script>

    <!-- React App script -->
    <script type="module" src="/src/main.tsx"></script>
  </body>

</html>
