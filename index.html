<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>notTaki</title>
    <style>
      .cd-preloader {
        background-color: #111111;
        position: fixed;
        inset: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        perspective: 1000px;
        transition: transform 1.5s ease-in-out,
          filter 1.5s ease-in-out,
          opacity 1.5s ease-in-out;
        z-index: 9999;
        will-change: transform, opacity;
      }

      .cd-preloader.exit {
        transform: scale(20);
        opacity: 0;
        pointer-events: none;
      }

      .cd {
        position: relative;
        height: 300px;
        width: 300px;
        border-radius: calc(infinity * 1px);
        background: radial-gradient(circle,
            transparent 30%,
            #ffffff1a 35%,
            transparent 40%),
          conic-gradient(from 0deg,
            #d1d5db,
            #ffffff,
            #e6f0ff,
            #9ca3af,
            #ffffff,
            #d1d5db);
        animation: spinCD 3s linear infinite;
        box-shadow: inset 0 0 0 2px #d1d5db, 0 0 0 4px #ffffff;
      }

      /* Plastic part */
      .cd::before {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        border-radius: calc(infinity * 1px);
        height: 120px;
        width: 120px;
        background-color: #aecfda88;
        box-shadow: inset 0 0 0 2px #ffffffe6,
          inset 0 0 5px #0000004d;
      }

      /* Hole in the middle */
      .cd::after {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        height: 60px;
        width: 60px;
        border-radius: calc(infinity * 1px);
        background-color: #111111;
        box-shadow: 0 0 6px 1px #ffffff;
      }

      @keyframes spinCD {
        0% {
          transform: rotateZ(0deg);
        }

        100% {
          transform: rotateZ(360deg);
        }
      }
    </style>
  </head>

  <body>
    <div class="cd-preloader">
      <div class="cd"></div>
    </div>
    <div id="root"></div>
    <script>
      window.addEventListener('load', () => {
        const preloader = document.querySelector('.cd-preloader');
        setTimeout(() => {
          preloader.classList.add('exit');
          setTimeout(() => {
            preloader.remove()
          }, 2000);
        }, 4000);
      })
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>

</html>
