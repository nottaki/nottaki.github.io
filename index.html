<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- seo:start -->
    <title>definitely not Taki !</title>
    <meta name="description" content="The Official notTaki Website." />
    <!-- seo:end -->
    <script>
      (function () {
        var redirect = sessionStorage.getItem('spa-redirect')
        sessionStorage.removeItem('spa-redirect')
        if (redirect) {
          history.replaceState(null, '', redirect)
        }
      })()
    </script>
    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      #preloader {
        background-color: #111111;
        position: fixed;
        inset: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        perspective: 1000px;
        transition: transform 1.5s ease-in-out,
          filter 1.5s ease-in-out,
          opacity 1.5s ease-in-out;
        z-index: 9999;
        will-change: opacity, transform;
        animation: customFadeIn 1s cubic-bezier(0.645, 0.045, 0.355, 1);
      }

      #preloader.exit {
        opacity: 0;
        transform: scale(20);
        pointer-events: none;
        backdrop-filter: blur(6px);
      }

      #cd-wrapper {
        transition: transform 0.1s ease-out;
        transform-origin: center center;
      }

      #cd {
        position: relative;
        height: 300px;
        width: 300px;
        border-radius: 50%;
        background: radial-gradient(circle,
            transparent 30%,
            #ffffff1a 35%,
            transparent 40%),
          conic-gradient(from 0deg,
            #d1d5db,
            #ffffff,
            #e6f0ff,
            #9ca3af,
            #ffffff,
            #d1d5db);
        animation: spinCD 3s linear infinite;
        box-shadow: inset 0 0 0 2px #d1d5db, 0 0 0 4px #ffffff;
      }

      /* Plastic part */
      #cd::before {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        height: 120px;
        width: 120px;
        background-color: #aecfda88;
        box-shadow: inset 0 0 0 2px #ffffffe6, inset 0 0 5px #0000004d;
      }

      /* Hole in the middle */
      #cd::after {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        height: 60px;
        width: 60px;
        background-color: #111111;
        box-shadow: 0 0 6px 1px #ffffff;
      }

      @keyframes spinCD {
        from {
          transform: rotateZ(0deg);
        }

        to {
          transform: rotateZ(360deg);
        }
      }

      @keyframes customFadeIn {
        0% {
          opacity: 0;
          scale: 1.2;
        }

        100% {
          opacity: 1;
        }
      }

      /* App Root starts hidden */
      #root {
        opacity: 0;
        transition: opacity 3s ease-out, filter 6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }

      #root.ready {
        opacity: 1;
      }
    </style>
  </head>

  <body>
    <div id="preloader">
      <div id="cd-wrapper">
        <div id="cd"></div>
      </div>
    </div>

    <div id="root"></div>

    <script>
        (function () {
          document.body.style.overflow = 'hidden';
          document.documentElement.style.overflow = 'hidden';

          const preloader = document.getElementById('preloader');
          const wrapper = document.getElementById('cd-wrapper');
          const appRoot = document.getElementById('root');
          const MAX_TILT_DEGREES = 30;

          let rafId = null;
          let isReactReady = false;
          let minTimePassed = false;

          const handleMouseMove = (e) => {
            if (rafId) return;
            rafId = requestAnimationFrame(() => {
              // Find the exact center of the whole browser window
              const centerX = window.innerWidth / 2;
              const centerY = window.innerHeight / 2;

              // Calculate the tilt based on window size
              // We use `window.innerWidth / 2` as the divisor so the max tilt happens at the edges of the screen
              const rotateY = ((e.clientX - centerX) / centerX) * MAX_TILT_DEGREES;
              const rotateX = -((e.clientY - centerY) / centerY) * MAX_TILT_DEGREES;

              if (wrapper) {
                wrapper.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
              }
              rafId = null;
            });
          };

          // The preloader hide function
          const hidePreloader = () => {
            if (!preloader || preloader.classList.contains('exit')) return;

            document.removeEventListener('mousemove', handleMouseMove);

            if (wrapper) {
              wrapper.style.transform = 'rotateX(0deg) rotateY(0deg)';
            }

            preloader.classList.add('exit');
            if (appRoot) {
              appRoot.classList.add('ready');
            }

            // Remove from DOM after transition completes
            setTimeout(() => {
              if (preloader) {
                preloader.remove()
              }
              document.body.style.overflow = '';
              document.documentElement.style.overflow = '';
            }, 1500);
          };

          // Check if both conditions are met
          const checkAndHide = () => {
            if (isReactReady && minTimePassed) {
              hidePreloader();
            }
          };

          // React calls this when it's hydrated and ready
          window.hidePreloader = () => {
            isReactReady = true;
            checkAndHide();
          };

          // Ensure a minimum display time (e.g., 4000ms) so the animation is seen
          // and to prevent any flashing if React loads instantly.
          setTimeout(() => {
            minTimePassed = true;
            checkAndHide();
          }, 4000);

          // Safety fallback: If something goes wrong and React never calls hidePreloader,
          // force it to disappear after 10 seconds so the user isn't stuck forever.
          setTimeout(() => {
            if (!preloader.classList.contains('exit')) {
              isReactReady = true; // Force it
              checkAndHide();
            }
          }, 10000); // 10000 to give React plenty of time even on slow connections

          document.addEventListener('mousemove', handleMouseMove);
        })();
    </script>

    <!-- React App script -->
    <script type="module" src="/src/main.tsx"></script>
  </body>

</html>
